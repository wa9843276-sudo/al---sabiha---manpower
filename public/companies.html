<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companies | AL SABIHA</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>
shell("companies","Companies",`<div class="panel"><h2>Add / Edit Company</h2><form id="f"><input type="hidden" id="id"><div class="form-grid"><div class="field"><label>Company Name</label><input id="name" required></div><div class="field"><label>Contact Person</label><input id="contact_person"></div><div class="field"><label>Contact Number</label><input id="contact_number"></div><div class="field"><label>Status</label><select id="status"><option>Active</option><option>Inactive</option></select></div></div><br><button class="btn gold">Save Company</button></form></div><div class="panel"><h2>Company Database</h2><div class="table-wrap"><table><thead><tr><th>Company</th><th>Contact Person</th><th>Contact</th><th>Sites</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>`);
let data=[];async function load(){data=await api("/api/companies");$("#rows").innerHTML=data.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.contact_person||"—")}</td><td>${esc(x.contact_number||"—")}</td><td>${x.site_count||0}</td><td><span class="badge">${esc(x.status)}</span></td><td><button class="btn ghost" onclick="edit(${x.id})">Edit</button> <button class="btn ghost" onclick="del(${x.id})">Disable</button></td></tr>`).join("")||'<tr><td colspan="6">No companies.</td></tr>'}window.edit=id=>{const x=data.find(z=>z.id===id);$("#id").value=id;$("#name").value=x.name;$("#contact_person").value=x.contact_person||"";$("#contact_number").value=x.contact_number||"";$("#status").value=x.status||"Active"};window.del=async id=>{if(confirm("Disable this company?")){await api("/api/companies/"+id,{method:"DELETE"});load()}};$("#f").onsubmit=async e=>{e.preventDefault();const b={name:$("#name").value,contact_person:$("#contact_person").value,contact_number:$("#contact_number").value,status:$("#status").value};const id=$("#id").value;await api(id?"/api/companies/"+id:"/api/companies",{method:id?"PUT":"POST",body:JSON.stringify(b)});e.target.reset();$("#id").value="";load()};load();loadMe();</script></body></html>
