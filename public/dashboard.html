<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | AL SABIHA</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>
shell("dashboard","Dashboard",`<div class="hero"><h1>Welcome Back, Admin</h1><p>AL SABIHA Manpower Attendance System</p><div class="date" id="date">Today</div></div>
<div class="stats"><div class="stat"><div class="ico">♙</div><b id="workers">0</b><span>Total Workers</span></div><div class="stat"><div class="ico">▦</div><b id="companies">0</b><span>Total Companies</span></div><div class="stat"><div class="ico">⌖</div><b id="sites">0</b><span>Active Sites</span></div><div class="stat"><div class="ico">▣</div><b id="present">0</b><span>Today Attendance</span></div></div>
<div class="grid2"><div class="card"><h2>Recent Attendance</h2><div class="table-wrap"><table><thead><tr><th>Worker Name</th><th>Company</th><th>Site</th><th>Check In</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="card"><h2>Quick Actions</h2><div class="actions"><a class="action" href="/workers.html"><div class="big">♙+</div><b>Add Worker</b></a><a class="action" href="/companies.html"><div class="big">▦</div><b>Add Company</b></a><a class="action" href="/sites.html"><div class="big">⌖+</div><b>Add Site</b></a><a class="action" href="/scan.html"><div class="big">▣</div><b>Scan QR</b></a><a class="action" href="/manual-attendance.html"><div class="big">✓</div><b>Manual Attendance</b></a><a class="action" href="/reports.html"><div class="big">▤</div><b>Reports</b></a></div></div>
<div class="card" style="background:linear-gradient(150deg,#061a30,#0b3557);color:white;display:flex;align-items:center;justify-content:center;text-align:center"><div><img src="/logo.svg" style="width:210px"><h2 style="color:#f5d477">Right People<br>Right Place<br>Right Time</h2></div></div></div>`);
(async()=>{try{const d=await api("/api/dashboard");$("#workers").textContent=d.total_workers;$("#companies").textContent=d.total_companies;$("#sites").textContent=d.total_sites;$("#present").textContent=d.present_today;$("#date").textContent="Today • "+d.date;$("#rows").innerHTML=(d.todays_attendance||[]).slice(0,8).map(r=>`<tr><td>${esc(r.worker_name)}</td><td>${esc(r.company_name||"—")}</td><td>${esc(r.site_name||"—")}</td><td>${esc(r.check_in||"—").slice(11,16)}</td><td><span class="badge">${esc(r.check_out?"Checked Out":"In")}</span></td></tr>`).join("")||`<tr><td colspan="5">No attendance today.</td></tr>`}catch(e){alert(e.message)}})();loadMe();</script></body></html>
