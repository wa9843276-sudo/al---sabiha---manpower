<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dashboard | AL SABIHA</title>
<link rel="icon" href="/Logo.svg"></head><body>
<script src="/app.js"></script><script src="/js/charts.js"></script>
<script>
shell("dashboard", "Dashboard", `
<div class="panel"><div class="toolbar" style="margin:0">
  <div class="field"><label for="fDate">Date</label><input id="fDate" type="date"></div>
  <div class="field"><label for="fCompany">Working company</label><select id="fCompany"><option value="">All companies</option></select></div>
  <div class="field"><label for="fSite">Site</label><select id="fSite"><option value="">All sites</option></select></div>
  <div class="field"><label for="fStatus">Worker status (charts)</label><select id="fStatus"><option value="">Active (default)</option><option>Active</option><option>Inactive</option></select></div>
  <button class="btn ghost" id="reset">Reset</button>
</div></div>
<div id="kpis" class="kpis"><div class="loading">Loading metrics…</div></div>
<div class="grid g2">
  <section class="panel"><h2>Workers by working company</h2><div id="cCompany"></div></section>
  <section class="panel"><h2>Group companies vs external suppliers</h2><div id="cType"></div></section>
  <section class="panel"><h2>Workers by Visa/Sponsor company</h2><div id="cSponsor"></div></section>
  <section class="panel"><h2>Workers by designation / trade</h2><div id="cDesig"></div></section>
  <section class="panel"><h2>Active vs inactive workforce</h2><div id="cStatus"></div></section>
  <section class="panel"><h2>Attendance trend — daily</h2><div id="cDaily"></div></section>
</div>
<section class="panel"><h2>Attendance trend — monthly (last 12 months)</h2><div id="cMonthly"></div></section>
<section class="panel"><h2>Company-wise workforce distribution</h2><div id="dist"></div>
 <p class="hint" style="color:var(--muted);font-size:12px;margin-top:10px">Headcounts are unique workers by current working company. “Present” counts unique workers with a check-in on the selected date, by the company recorded at check-in.</p></section>
<section class="panel"><h2>How these numbers are calculated</h2><dl class="dl" id="defs"></dl></section>
`);
loadMe();
const F = { date: $("#fDate"), company: $("#fCompany"), site: $("#fSite"), status: $("#fStatus") };
const num = n => (n ?? "—");

async function init() {
  const L = await api("/api/v2/lookups");
  L.companies.filter(c => c.status === "Active").forEach(c => F.company.add(new Option(c.name, c.id)));
  L.sites.filter(s => s.status === "Active").forEach(s => F.site.add(new Option(s.name + (s.location ? " — " + s.location : ""), s.id)));
  load();
}
async function load() {
  try {
    const d = await api("/api/v2/dashboard?" + qs({ date: F.date.value, company_id: F.company.value, site_id: F.site.value, status: F.status.value }));
    F.date.value = d.date;
    const k = d.kpis, df = d.definitions;
    const card = (t, v, sub, key, cls = "") => `<div class="kpi ${cls}"><span class="info" title="${esc(df[key] || "")}">i</span><small>${t}</small><b>${v}</b><em>${sub || "&nbsp;"}</em></div>`;
    $("#kpis").innerHTML =
      card("Total Workers", num(k.total_workers), "all statuses", "total_workers", "accent") +
      card("Active Workers", num(k.active_workers), "", "active_workers") +
      card("Inactive Workers", num(k.inactive_workers), "", "total_workers") +
      card("Group Company Workers", num(k.group_company_workers), "active", "group_company_workers") +
      card("Supplier Workers", num(k.supplier_workers), "active", "supplier_workers") +
      card("Today's Present", num(k.present_today), k.attendance_rate_pct == null ? "" : k.attendance_rate_pct + "% of active workers", "present_today", "cyan") +
      card("Today's Absent", "N/A", "no expected-attendance roster", "absent_today") +
      card("Currently Checked-In", num(k.checked_in_now), "open check-ins", "checked_in_now", "cyan") +
      card("Total Companies", num(k.total_companies), "active", "total_workers") +
      card("Active Sites", num(k.active_sites), "", "total_workers");
    barChart($("#cCompany"), d.charts.by_company);
    donutChart($("#cType"), d.charts.by_type, { centerLabel: "workers" });
    barChart($("#cSponsor"), d.charts.by_sponsor, { gold: true });
    barChart($("#cDesig"), d.charts.by_designation);
    donutChart($("#cStatus"), d.charts.active_vs_inactive, { centerLabel: "workers" });
    lineChart($("#cDaily"), d.charts.daily_trend, { key: "workers", key2: "records", label: p => p.date.slice(5) });
    $("#cDaily").insertAdjacentHTML("beforeend", `<div class="legend" style="flex-direction:row;gap:16px;margin-top:6px"><span><i style="background:#0e8aa6"></i>Unique workers</span><span><i style="background:#b88a2a"></i>Attendance records</span></div>`);
    lineChart($("#cMonthly"), d.charts.monthly_trend, { key: "workers", key2: "records", label: p => p.month });
    const rows = d.distribution;
    $("#dist").innerHTML = rows.length ? `<div class="table-wrap"><table><thead><tr><th>Company</th><th>Category</th><th class="num">Active</th><th class="num">Inactive</th><th class="num">Group</th><th class="num">Supplier</th><th class="num">Present on date</th><th>Share of active</th></tr></thead><tbody>` +
      rows.map(r => `<tr><td>${esc(r.company_name)}</td><td>${r.roles.length ? r.roles.map(x => `<span class="badge info">${esc(x)}</span>`).join(" ") : '<span class="badge warn">Unclassified</span>'}</td>
      <td class="num">${r.active_workers}</td><td class="num">${r.inactive_workers}</td><td class="num">${r.group_workers}</td><td class="num">${r.supplier_workers}</td><td class="num">${r.present_on_date}</td>
      <td><div class="pct" title="${k.active_workers ? Math.round(r.active_workers / k.active_workers * 100) : 0}%"><i style="width:${k.active_workers ? r.active_workers / k.active_workers * 100 : 0}%"></i></div></td></tr>`).join("") + `</tbody></table></div>` : `<div class="empty"><b>No companies</b>Add a company first.</div>`;
    $("#defs").innerHTML = Object.entries(df).map(([a, b]) => `<dt>${esc(a.replace(/_/g, " "))}</dt><dd>${esc(b)}</dd>`).join("");
  } catch (e) { $("#kpis").innerHTML = `<div class="message error">${esc(e.message)}</div>`; }
}
Object.values(F).forEach(el => el.addEventListener("change", load));
$("#reset").onclick = () => { F.date.value = ""; F.company.value = ""; F.site.value = ""; F.status.value = ""; load(); };
init();
</script></body></html>
