// =========================================================
// DASHBOARD DATA

(async()=>{

  try{

    const d =
      await api("/api/dashboard");


    /* =========================================
       MAIN STATS
    ========================================= */

    $("#workers").textContent =
      d.total_workers || 0;

    $("#companies").textContent =
      d.total_companies || 0;

    $("#sites").textContent =
      d.total_sites || 0;

    $("#present").textContent =
      d.present_today || 0;

    $("#absent").textContent =
      d.absent_today || 0;

    $("#checkedin").textContent =
      d.checked_in || 0;


    $("#date").textContent =
      "Today • " +
      (d.date || "");


    /* =========================================
       COMPANY SUMMARY
    ========================================= */

    const companyBox =
      $("#companySummary");

    const companies =
      d.company_summary || [];


    if(!companies.length){

      companyBox.innerHTML = `

        <div class="dashboard-empty">

          No companies available yet.

          <br>

          Add companies and assign workers
          to see company-wise attendance.

        </div>

      `;

    }else{

      companyBox.innerHTML =
        companies.map(c=>{

          const total =
            Number(
              c.total_workers || 0
            );

          const present =
            Number(
              c.present || 0
            );

          const absent =
            Math.max(
              0,
              total-present
            );


          return `

            <div class="company-box">

              <h3 class="company-name">

                ${esc(
                  c.company_name ||
                  "Unknown Company"
                )}

              </h3>


              <div class="company-numbers">


                <div class="company-number">

                  <strong>
                    ${total}
                  </strong>

                  <small>
                    Workers
                  </small>

                </div>


                <div
                  class="
                    company-number
                    present-number
                  ">

                  <strong>
                    ${present}
                  </strong>

                  <small>
                    Present
                  </small>

                </div>


                <div
                  class="
                    company-number
                    absent-number
                  ">

                  <strong>
                    ${absent}
                  </strong>

                  <small>
                    Absent
                  </small>

                </div>


              </div>

            </div>

          `;

        }).join("");

    }


    /* =========================================
       RECENT ATTENDANCE
    ========================================= */

    const rows =
      d.todays_attendance || [];


    $("#rows").innerHTML =

      rows
        .slice(0,8)
        .map(r=>{

          const checkedOut =
            !!r.check_out;


          return `

            <tr>

              <td>
                ${esc(
                  r.worker_name || "—"
                )}
              </td>

              <td>
                ${esc(
                  r.company_name || "—"
                )}
              </td>

              <td>
                ${esc(
                  r.site_name || "—"
                )}
              </td>

              <td>

                ${
                  r.check_in
                  ? esc(
                      r.check_in
                    ).slice(11,16)
                  : "—"
                }

              </td>

              <td>

                ${
                  checkedOut
                  ? esc(
                      r.check_out
                    ).slice(11,16)
                  : "—"
                }

              </td>

              <td>

                <span
                  class="
                    status-badge
                    ${checkedOut
                      ? "status-out"
                      : ""}
                  ">

                  ${
                    checkedOut
                    ? "Checked Out"
                    : "Checked In"
                  }

                </span>

              </td>

            </tr>

          `;

        }).join("")

        ||

        `

          <tr>

            <td
              colspan="6"
              style="
                text-align:center;
                padding:30px;
                color:#40566b;
              ">

              No attendance today.

            </td>

          </tr>
