<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual Attendance | AL SABIHA</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>
shell("manual","Manual Attendance",`<div class="panel"><form id="f"><div class="form-grid"><div class="field"><label>Worker</label><select id="worker"></select></div><div class="field"><label>Company</label><select id="company"></select></div><div class="field"><label>Site</label><select id="site"></select></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Check In</label><input id="in" type="datetime-local"></div><div class="field"><label>Check Out</label><input id="out" type="datetime-local"></div><div class="field"><label>Remarks</label><input id="remarks"></div></div><br><button class="btn gold">Save Attendance</button></form></div>`);
async function load(){const [w,c,s]=await Promise.all([api("/api/workers"),api("/api/companies"),api("/api/sites")]);$("#worker").innerHTML=w.filter(x=>x.status==="Active").map(x=>`<option value="${x.id}">${esc(x.worker_code)} — ${esc(x.name)}</option>`).join("");$("#company").innerHTML='<option value="">—</option>'+c.filter(x=>x.status==="Active").map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");$("#site").innerHTML=s.filter(x=>x.status==="Active").map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");$("#date").value=new Date().toISOString().slice(0,10)}$("#f").onsubmit=async e=>{e.preventDefault();const b={worker_id:$("#worker").value,company_id:$("#company").value,site_id:$("#site").value,attendance_date:$("#date").value,check_in:$("#in").value.replace("T"," "),check_out:$("#out").value.replace("T"," "),remarks:$("#remarks").value};await api("/api/attendance/manual",{method:"POST",body:JSON.stringify(b)});alert("Attendance saved");e.target.reset();load()};load();loadMe();</script></body></html>
