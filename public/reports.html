<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reports | AL SABIHA</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<script src="/app.js"></script>

<script>

shell(
  "reports",
  "Attendance Reports",
  `
  <div class="panel">

    <div class="form-grid">

      <div class="field">
        <label>From</label>
        <input id="from" type="date">
      </div>

      <div class="field">
        <label>To</label>
        <input id="to" type="date">
      </div>

      <div class="field">
        <label>Company</label>
        <select id="company">
          <option value="">All Companies</option>
        </select>
      </div>

      <div class="field">
        <label>Site</label>
        <select id="site">
          <option value="">All Sites</option>
        </select>
      </div>

    </div>

    <br>

    <button class="btn gold" onclick="load()">
      Generate Report
    </button>

    <button class="btn dark" onclick="download()">
      Export Excel
    </button>

  </div>

  <div class="panel">

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Date</th>
            <th>Worker Code</th>
            <th>Worker</th>
            <th>Company</th>
            <th>Site</th>
            <th>Check In</th>
            <th>Check Out</th>
            <th>Type</th>
          </tr>
        </thead>

        <tbody id="rows"></tbody>

      </table>

    </div>

  </div>
  `
);


// Load companies and sites
async function init(){

  try{

    const [c,s] = await Promise.all([
      api("/api/companies"),
      api("/api/sites")
    ]);

    $("#company").innerHTML =
      '<option value="">All Companies</option>' +
      c.map(x =>
        `<option value="${x.id}">${esc(x.name)}</option>`
      ).join("");

    $("#site").innerHTML =
      '<option value="">All Sites</option>' +
      s.map(x =>
        `<option value="${x.id}">${esc(x.name)}</option>`
      ).join("");

  }catch(error){

    console.error(error);

  }

}


// Generate query parameters
function getReportQuery(){

  return new URLSearchParams({

    date_from:$("#from").value,
    date_to:$("#to").value,
    company_id:$("#company").value,
    site_id:$("#site").value

  });

}


// Generate Report
async function load(){

  try{

    const q = getReportQuery();

    const d = await api(
      "/api/reports?" + q.toString()
    );

    $("#rows").innerHTML =
      d.map(x => `

        <tr>

          <td>${esc(x.attendance_date)}</td>

          <td>${esc(x.worker_code)}</td>

          <td>${esc(x.worker_name)}</td>

          <td>${esc(x.company_name || "—")}</td>

          <td>${esc(x.site_name || "—")}</td>

          <td>${esc(x.check_in || "—")}</td>

          <td>${esc(x.check_out || "—")}</td>

          <td>${x.is_manual ? "MANUAL" : "QR"}</td>

        </tr>

      `).join("") ||

      '<tr><td colspan="8">No records.</td></tr>';

  }catch(error){

    alert(
      error.message || "Unable to generate report."
    );

  }

}


// Download Excel
async function download(){

  try{

    const q = getReportQuery();

    const response = await fetch(
      "/api/reports/export.xlsx?" + q.toString(),
      {
        method:"GET",
        credentials:"same-origin"
      }
    );

    if(!response.ok){

      let message = "Excel export failed.";

      try{
        const data = await response.json();
        message = data.error || message;
      }catch(e){}

      throw new Error(message);

    }

    const blob = await response.blob();

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;

    a.download = "AL-SABIHA-Attendance-Report.xlsx";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

  }catch(error){

    alert(
      error.message || "Excel download failed."
    );

  }

}


// Initialize
init();
load();
loadMe();

</script>

</body>
</html>
