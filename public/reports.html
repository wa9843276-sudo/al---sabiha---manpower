<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | AL SABIHA</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>
shell("reports","Attendance Reports",`<div class="panel"><div class="form-grid"><div class="field"><label>From</label><input id="from" type="date"></div><div class="field"><label>To</label><input id="to" type="date"></div><div class="field"><label>Company</label><select id="company"></select></div><div class="field"><label>Site</label><select id="site"></select></div></div><br><button class="btn gold" onclick="load()">Generate Report</button> <button class="btn dark" onclick="download()">Export Excel</button></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Worker</th><th>Company</th><th>Site</th><th>Check In</th><th>Check Out</th><th>Type</th></tr></thead><tbody id="rows"></tbody></table></div></div>`);
async function init(){const [c,s]=await Promise.all([api("/api/companies"),api("/api/sites")]);$("#company").innerHTML='<option value="">All</option>'+c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");$("#site").innerHTML='<option value="">All</option>'+s.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}async function load(){const q=new URLSearchParams({date_from:$("#from").value,date_to:$("#to").value,company_id:$("#company").value,site_id:$("#site").value});const d=await api("/api/reports?"+q);$("#rows").innerHTML=d.map(x=>`<tr><td>${esc(x.attendance_date)}</td><td>${esc(x.worker_name)}</td><td>${esc(x.company_name||"—")}</td><td>${esc(x.site_name||"—")}</td><td>${esc(x.check_in||"—")}</td><td>${esc(x.check_out||"—")}</td><td>${x.is_manual?"MANUAL":"QR"}</td></tr>`).join("")||'<tr><td colspan="7">No records.</td></tr>'}function download(){alert("Use the browser print/export function for now. Excel export can be enabled in the next backend revision.")}init();load();loadMe();</script></body></html>
