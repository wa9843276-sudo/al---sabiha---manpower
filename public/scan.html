<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Attendance | AL SABIHA</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    .scan-page{
      max-width:1100px;
      margin:0 auto;
      padding:25px;
    }

    .scan-hero{
      background:linear-gradient(135deg,#0b1733,#17264d);
      border:1px solid rgba(212,175,55,.35);
      border-radius:22px;
      padding:28px;
      margin-bottom:22px;
      box-shadow:0 18px 50px rgba(0,0,0,.20);
    }

    .scan-title{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .scan-logo{
      width:55px;
      height:55px;
      border-radius:14px;
      object-fit:contain;
      background:rgba(255,255,255,.08);
      padding:7px;
    }

    .scan-title h1{
      margin:0;
      color:#fff;
      font-size:28px;
      font-weight:800;
    }

    .scan-title p{
      margin:5px 0 0;
      color:#d6d9e2;
      font-size:14px;
    }

    .scan-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:22px;
    }

    .card{
      background:#fff;
      border-radius:20px;
      padding:22px;
      border:1px solid #e7e9ef;
      box-shadow:0 12px 35px rgba(15,23,42,.08);
    }

    .card h2{
      margin:0 0 18px;
      color:#111827;
      font-size:20px;
    }

    .field{
      margin-bottom:16px;
    }

    .field label{
      display:block;
      margin-bottom:7px;
      font-weight:700;
      color:#374151;
      font-size:14px;
    }

    .field input,
    .field select{
      width:100%;
      box-sizing:border-box;
      min-height:48px;
      border:1px solid #d9dee8;
      border-radius:11px;
      padding:10px 12px;
      font-size:15px;
      background:#fff;
      outline:none;
    }

    .field input:focus,
    .field select:focus{
      border-color:#c9a227;
      box-shadow:0 0 0 3px rgba(201,162,39,.12);
    }

    .find-row{
      display:grid;
      grid-template-columns:1fr 130px;
      gap:10px;
    }

    .btn{
      min-height:48px;
      border:0;
      border-radius:11px;
      padding:10px 15px;
      font-weight:800;
      cursor:pointer;
      transition:.2s;
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .btn-find{
      background:#172554;
      color:#fff;
    }

    .btn-checkin{
      background:#c9a227;
      color:#101828;
    }

    .btn-checkout{
      background:#172554;
      color:#fff;
    }

    .btn:disabled{
      opacity:.5;
      cursor:not-allowed;
      transform:none;
    }

    .worker-box{
      display:none;
      margin:18px 0;
      padding:17px;
      border-radius:15px;
      background:#f8fafc;
      border:1px solid #e5e7eb;
    }

    .worker-box.show{
      display:block;
    }

    .worker-name{
      font-size:21px;
      font-weight:800;
      color:#111827;
      margin-bottom:5px;
    }

    .worker-info{
      color:#667085;
      font-size:14px;
      line-height:1.7;
    }

    .action-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:18px;
    }

    .gps-box{
      margin-top:18px;
      padding:13px;
      border-radius:12px;
      background:#f7f8fb;
      border:1px solid #e5e7eb;
      color:#475467;
      font-size:13px;
    }

    .message{
      display:none;
      margin-top:15px;
      padding:13px;
      border-radius:11px;
      font-weight:700;
    }

    .message.show{
      display:block;
    }

    .success{
      background:#ecfdf3;
      border:1px solid #abefc6;
      color:#067647;
    }

    .error{
      background:#fef3f2;
      border:1px solid #fecdca;
      color:#b42318;
    }

    #reader{
      width:100%;
      overflow:hidden;
      border-radius:16px;
    }

    .scanner-status{
      margin-top:12px;
      padding:12px;
      border-radius:10px;
      background:#f4f6fa;
      color:#475467;
      text-align:center;
      font-size:13px;
    }

    .scanner-note{
      margin-top:12px;
      padding:12px;
      background:#fff8e1;
      border:1px solid #f1df9a;
      border-radius:10px;
      color:#735b00;
      font-size:13px;
    }

    .site-display{
      min-height:48px;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      padding:10px 12px;
      border:1px solid #d9dee8;
      border-radius:11px;
      background:#f8fafc;
      color:#344054;
      font-size:15px;
      font-weight:600;
    }

    @media(max-width:800px){
      .scan-grid{
        grid-template-columns:1fr;
      }

      .scan-page{
        padding:15px;
      }
    }

    @media(max-width:520px){
      .find-row{
        grid-template-columns:1fr;
      }

      .action-grid{
        grid-template-columns:1fr;
      }

      .scan-title h1{
        font-size:23px;
      }
    }
  </style>
</head>

<body>

<script src="/app.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<script>

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let scanner = null;
let currentWorker = null;
let currentGPS = null;
let audioContext = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

let workerCode;
let findWorkerBtn;
let workerBox;
let workerName;
let workerInfo;
let company;
let site;
let siteDisplay;
let checkinBtn;
let checkoutBtn;
let gpsStatus;
let successMessage;
let errorMessage;
let scannerStatus;


/* =========================================================
   VOICE
   ========================================================= */

function speakAttendance(message){

  try{

    if(!("speechSynthesis" in window)){
      return;
    }

    window.speechSynthesis.cancel();

    const voice =
      new SpeechSynthesisUtterance(message);

    voice.lang = "en-US";
    voice.rate = 0.9;
    voice.pitch = 1;
    voice.volume = 1;

    window.speechSynthesis.speak(voice);

  }catch(error){

    console.log("Voice unavailable:",error);

  }

}


/* =========================================================
   SOUND
   ========================================================= */

function playAttendanceSound(type){

  try{

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx){

      if(type==="checkin")
        speakAttendance("Check in successfully");

      if(type==="checkout")
        speakAttendance("Check out successfully");

      if(type==="error")
        speakAttendance("Error. Please try again.");

      return;
    }

    if(!audioContext){
      audioContext = new AudioCtx();
    }

    if(audioContext.state==="suspended"){
      audioContext.resume();
    }

    const startTime =
      audioContext.currentTime;

    function tone(
      frequency,
      start,
      duration,
      volume
    ){

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type="sine";

      oscillator.frequency.value =
        frequency;

      gain.gain.setValueAtTime(
        0,
        startTime+start
      );

      gain.gain.linearRampToValueAtTime(
        volume,
        startTime+start+.02
      );

      gain.gain.linearRampToValueAtTime(
        0,
        startTime+start+duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(
        startTime+start
      );

      oscillator.stop(
        startTime+start+duration+.03
      );

    }

    if(type==="checkin"){

      tone(880,0,.12,.45);
      tone(1175,.14,.18,.45);

      setTimeout(
        ()=>speakAttendance(
          "Check in successfully"
        ),
        200
      );

    }

    if(type==="checkout"){

      tone(660,0,.12,.45);
      tone(880,.14,.18,.45);

      setTimeout(
        ()=>speakAttendance(
          "Check out successfully"
        ),
        200
      );

    }

    if(type==="error"){

      tone(220,0,.30,.50);

      setTimeout(
        ()=>speakAttendance(
          "Error. Please try again."
        ),
        150
      );

    }

  }catch(error){

    console.log("Sound error:",error);

  }

}


/* =========================================================
   PAGE
   ========================================================= */

shell(
  "scan",
  "QR Scan Attendance",
  `

  <main class="scan-page">

    <section class="scan-hero">

      <div class="scan-title">

        <img
          src="/logo.svg"
          class="scan-logo"
          alt="AL SABIHA"
          onerror="this.style.display='none'"
        >

        <div>

          <h1>
            Attendance
          </h1>

          <p>
            AL SABIHA Workforce Attendance System
          </p>

        </div>

      </div>

    </section>


    <div class="scan-grid">


      <!-- WORKER ATTENDANCE -->

      <section class="card">

        <h2>
          Worker Attendance
        </h2>


        <div class="field">

          <label>
            Worker Code
          </label>

          <div class="find-row">

            <input
              id="workerCode"
              type="text"
              placeholder="Enter Worker Code"
              autocomplete="off"
            >

            <button
              id="findWorkerBtn"
              class="btn btn-find"
              type="button"
            >
              Find Worker
            </button>

          </div>

        </div>


        <div
          id="workerBox"
          class="worker-box"
        >

          <div
            id="workerName"
            class="worker-name"
          ></div>

          <div
            id="workerInfo"
            class="worker-info"
          ></div>


          <div class="field">

            <label>
              Company
            </label>

            <select id="company">

              <option value="">
                Select Company
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Site / Location
            </label>

            <select
              id="site"
              style="display:none;"
            >

              <option value="">
                Select Site / Location
              </option>

            </select>

            <div
              id="siteDisplay"
              class="site-display"
            >
              Select Company
            </div>

          </div>


          <div class="action-grid">

            <button
              id="checkinBtn"
              class="btn btn-checkin"
              type="button"
              disabled
            >
              ✓ CHECK IN
            </button>

            <button
              id="checkoutBtn"
              class="btn btn-checkout"
              type="button"
              disabled
            >
              ✓ CHECK OUT
            </button>

          </div>


          <div
            id="successMessage"
            class="message success"
          ></div>


          <div
            id="errorMessage"
            class="message error"
          ></div>


          <div class="gps-box">

            <strong>
              GPS Location
            </strong>

            <div
              id="gpsStatus"
              style="margin-top:6px"
            >
              Getting GPS location...
            </div>

          </div>

        </div>

      </section>


      <!-- QR SCANNER -->

      <section class="card">

        <h2>
          QR Scanner
        </h2>

        <div id="reader"></div>

        <div
          id="scannerStatus"
          class="scanner-status"
        >
          Starting camera...
        </div>

        <div class="scanner-note">

          QR scanning is optional.
          You can use Worker Code above
          if the QR camera is unavailable.

        </div>

      </section>

    </div>

  </main>

  `
);


/* =========================================================
   GET ELEMENTS
   ========================================================= */

workerCode =
  document.querySelector("#workerCode");

findWorkerBtn =
  document.querySelector("#findWorkerBtn");

workerBox =
  document.querySelector("#workerBox");

workerName =
  document.querySelector("#workerName");

workerInfo =
  document.querySelector("#workerInfo");

company =
  document.querySelector("#company");

site =
  document.querySelector("#site");

siteDisplay =
  document.querySelector("#siteDisplay");

checkinBtn =
  document.querySelector("#checkinBtn");

checkoutBtn =
  document.querySelector("#checkoutBtn");

gpsStatus =
  document.querySelector("#gpsStatus");

successMessage =
  document.querySelector("#successMessage");

errorMessage =
  document.querySelector("#errorMessage");

scannerStatus =
  document.querySelector("#scannerStatus");


/* =========================================================
   MESSAGES
   ========================================================= */

function showSuccess(message){

  successMessage.textContent =
    message;

  successMessage.classList.add("show");

  errorMessage.classList.remove("show");

}


function showError(message){

  errorMessage.textContent =
    message;

  errorMessage.classList.add("show");

  successMessage.classList.remove("show");

}


/* =========================================================
   RESET MESSAGES
   ========================================================= */

function clearMessages(){

  successMessage.classList.remove("show");
  errorMessage.classList.remove("show");

}


/* =========================================================
   GPS
   ========================================================= */

function getGPS(){

  if(!navigator.geolocation){

    gpsStatus.textContent =
      "GPS is not supported.";

    return;

  }

  navigator.geolocation.getCurrentPosition(

    position=>{

      currentGPS={

        latitude:
          position.coords.latitude,

        longitude:
          position.coords.longitude

      };

      gpsStatus.innerHTML =
        '<span style="color:#067647;font-weight:700">✓ GPS location ready</span>';

    },

    error=>{

      currentGPS=null;

      gpsStatus.innerHTML =
        '<span style="color:#b42318;font-weight:700">GPS unavailable or permission denied.</span>';

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );

}


/* =========================================================
   UPDATE BUTTONS
   ========================================================= */

function updateButtons(){

  const hasWorker =
    !!currentWorker;

  const hasCompany =
    !!company.value;

  const hasSite =
    !!site.value;

  const ready =
    hasWorker &&
    hasCompany &&
    hasSite;

  /*
   * Check-in only enabled when:
   * Worker + Company + Site exist
   */

  checkinBtn.disabled =
    !ready;

}


/* =========================================================
   LOAD COMPANIES
   ========================================================= */

async function loadCompanies(){

  try{

    const companiesData =
      await api("/api/companies");

    const companies =
      Array.isArray(companiesData)
        ? companiesData
        : [];

    company.innerHTML =
      `<option value="">Select Company</option>`;

    companies
      .filter(c =>
        String(c.status || "")
          .toLowerCase() === "active"
      )
      .forEach(c=>{

        const option =
          document.createElement("option");

        option.value =
          String(c.id);

        option.textContent =
          c.name;

        company.appendChild(option);

      });

    company._sites = [];

    site.innerHTML =
      `<option value="">Select Site / Location</option>`;

    siteDisplay.textContent =
      "Select Company";

  }catch(error){

    console.error(
      "Company loading error:",
      error
    );

    showError(
      "Unable to load companies."
    );

  }

}


/* =========================================================
   LOAD SITES FOR COMPANY
   ========================================================= */

async function loadCompanySites(
  companyId,
  autoSelect=true
){

  companyId =
    Number(companyId);

  site.value = "";

  site.innerHTML =
    `<option value="">Loading Site / Location...</option>`;

  siteDisplay.textContent =
    "Loading Site / Location...";

  if(!companyId){

    company._sites = [];

    site.innerHTML =
      `<option value="">Select Site / Location</option>`;

    siteDisplay.textContent =
      "Select Company";

    updateButtons();

    return [];

  }

  try{

    const sitesResponse =
      await api("/api/sites");

    const allSites =
      Array.isArray(sitesResponse)
        ? sitesResponse
        : [];

    const companySites =
      allSites.filter(s =>

        Number(s.company_id) === companyId &&

        String(s.status || "")
          .toLowerCase() === "active"

      );

    company._sites =
      companySites;


    site.innerHTML =
      `<option value="">Select Site / Location</option>`;


    companySites.forEach(s=>{

      const option =
        document.createElement("option");

      option.value =
        String(s.id);

      const siteName =
        s.name || "Unnamed Site";

      const location =
        s.location || "";

      option.textContent =
        location
          ? `${siteName} — ${location}`
          : siteName;

      site.appendChild(option);

    });


    if(companySites.length === 0){

      siteDisplay.textContent =
        "No Site / Location found.";

      showError(
        "Is company ke liye koi Active Site / Location available nahi hai."
      );

      updateButtons();

      return [];

    }


    /*
     * Automatically select first active site.
     */

    if(autoSelect){

      const selectedSite =
        companySites[0];

      site.value =
        String(selectedSite.id);

      siteDisplay.textContent =
        selectedSite.location
          ? `${selectedSite.name} — ${selectedSite.location}`
          : selectedSite.name;

    }else{

      siteDisplay.textContent =
        "Select Site / Location";

    }


    updateButtons();

    return companySites;

  }catch(error){

    console.error(
      "Site loading error:",
      error
    );

    site.value = "";

    siteDisplay.textContent =
      "Unable to load Site / Location.";

    showError(
      error.message ||
      "Unable to load Site / Location."
    );

    updateButtons();

    return [];

  }

}


/* =========================================================
   COMPANY CHANGE
   ONLY ONE COMPANY EVENT
   ========================================================= */

company.addEventListener(
  "change",
  async function(){

    clearMessages();

    await loadCompanySites(
      this.value,
      true
    );

  }
);


/* =========================================================
   SITE CHANGE
   ========================================================= */

site.addEventListener(
  "change",
  function(){

    const selected =
      company._sites?.find(
        s =>
          String(s.id) ===
          String(site.value)
      );

    if(selected){

      siteDisplay.textContent =
        selected.location
          ? `${selected.name} — ${selected.location}`
          : selected.name;

    }else{

      siteDisplay.textContent =
        "Select Site / Location";

    }

    updateButtons();

  }
);


/* =========================================================
   FIND WORKER
   ========================================================= */

async function findWorker(code){

  code =
    String(code || "").trim();

  if(!code){

    playAttendanceSound("error");

    showError(
      "Please enter Worker Code."
    );

    return;

  }


  try{

    findWorkerBtn.disabled = true;

    clearMessages();


    const data =
      await api(
        "/api/attendance/lookup?worker_code=" +
        encodeURIComponent(code)
      );


    if(!data.worker){

      throw new Error(
        "Worker not found."
      );

    }


    currentWorker =
      data.worker;


    /* =====================================================
       WORKER DETAILS
       ===================================================== */

    workerBox.classList.add("show");

    workerName.textContent =
      currentWorker.name ||
      "Worker";


    workerInfo.innerHTML = `

      <div>
        <strong>Worker Code:</strong>
        ${esc(
          currentWorker.worker_code || code
        )}
      </div>

      ${
        currentWorker.designation
          ? `
            <div>
              <strong>Designation:</strong>
              ${esc(
                currentWorker.designation
              )}
            </div>
          `
          : ""
      }

      ${
        currentWorker.phone
          ? `
            <div>
              <strong>Phone:</strong>
              ${esc(
                currentWorker.phone
              )}
            </div>
          `
          : ""
      }

    `;


    /* =====================================================
       ASSIGNED COMPANY
       ===================================================== */

    const assignedCompany =
      data.assigned_company || null;


    if(
      assignedCompany &&
      assignedCompany.id
    ){

      const assignedCompanyId =
        String(
          assignedCompany.id
        );


      /*
       * Make sure company exists
       * in dropdown.
       */

      company.value =
        assignedCompanyId;


      /*
       * First load sites normally.
       */

      let workerSites = [];


      if(
        Array.isArray(
          data.assigned_company_sites
        )
      ){

        workerSites =
          data.assigned_company_sites.filter(
            s =>

              Number(s.company_id) ===
                Number(assignedCompanyId) &&

              String(s.status || "")
                .toLowerCase() ===
                "active"

          );

      }


      /*
       * If backend did not provide sites,
       * load from /api/sites.
       */

      if(
        workerSites.length === 0
      ){

        try{

          const sitesResponse =
            await api("/api/sites");

          const allSites =
            Array.isArray(
              sitesResponse
            )
              ? sitesResponse
              : [];


          workerSites =
            allSites.filter(
              s =>

                Number(s.company_id) ===
                  Number(assignedCompanyId) &&

                String(s.status || "")
                  .toLowerCase() ===
                  "active"

            );

        }catch(siteError){

          console.error(
            "Assigned site loading error:",
            siteError
          );

        }

      }


      company._sites =
        workerSites;


      /*
       * Rebuild hidden site select.
       */

      site.innerHTML =
        `<option value="">Select Site / Location</option>`;


      workerSites.forEach(s=>{

        const option =
          document.createElement("option");

        option.value =
          String(s.id);

        const siteName =
          s.name ||
          "Unnamed Site";

        const location =
          s.location ||
          "";

        option.textContent =
          location
            ? `${siteName} — ${location}`
            : siteName;

        site.appendChild(option);

      });


      /*
       * Automatically select first site.
       */

      if(workerSites.length > 0){

        const firstSite =
          workerSites[0];

        site.value =
          String(firstSite.id);

        siteDisplay.textContent =
          firstSite.location
            ? `${firstSite.name} — ${firstSite.location}`
            : firstSite.name;

      }else{

        site.value = "";

        siteDisplay.textContent =
          "No Site / Location found.";

        showError(
          "Is company ke liye koi Active Site / Location available nahi hai."
        );

      }


    }else{

      /*
       * Worker has no assigned company.
       */

      company.value = "";

      company._sites = [];

      site.innerHTML =
        `<option value="">Select Site / Location</option>`;

      siteDisplay.textContent =
        "Select Company";

    }


    /* =====================================================
       CURRENT ATTENDANCE STATUS
       ===================================================== */

    const currentlyCheckedIn =
      !!data.currently_checked_in;


    if(currentlyCheckedIn){

      /*
       * Already checked in:
       * Check-in disabled
       * Check-out enabled
       */

      checkinBtn.disabled =
        true;

      checkoutBtn.disabled =
        false;


      showError(
        "Worker is already checked in. Check out first."
      );

    }else{

      /*
       * Not checked in:
       * Check-in depends on Worker + Company + Site.
       * Check-out disabled.
       */

      checkoutBtn.disabled =
        true;

      updateButtons();

      showSuccess(
        "Worker found successfully."
      );

    }


    getGPS();


  }catch(error){

    currentWorker =
      null;

    workerBox.classList.remove(
      "show"
    );

    checkinBtn.disabled =
      true;

    checkoutBtn.disabled =
      true;

    playAttendanceSound("error");

    showError(
      error.message ||
      "Worker not found."
    );

  }finally{

    findWorkerBtn.disabled =
      false;

  }

}


/* =========================================================
   FIND WORKER BUTTON
   ========================================================= */

findWorkerBtn.addEventListener(
  "click",
  function(){

    findWorker(
      workerCode.value
    );

  }
);


/* =========================================================
   ENTER KEY
   ========================================================= */

workerCode.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      findWorker(
        workerCode.value
      );

    }

  }
);


/* =========================================================
   CHECK IN
   ========================================================= */

checkinBtn.addEventListener(
  "click",
  async function(){

    if(!currentWorker){

      playAttendanceSound("error");

      showError(
        "Please find a worker first."
      );

      return;

    }


    if(!company.value){

      playAttendanceSound("error");

      showError(
        "Please select Company."
      );

      return;

    }


    if(!site.value){

      playAttendanceSound("error");

      showError(
        "Please select Site / Location."
      );

      return;

    }


    try{

      checkinBtn.disabled =
        true;


      const body = {

        worker_code:
          currentWorker.worker_code ||
          workerCode.value.trim(),

        company_id:
          Number(company.value),

        site_id:
          Number(site.value)

      };


      if(currentGPS){

        body.latitude =
          currentGPS.latitude;

        body.longitude =
          currentGPS.longitude;

      }


      const result =
        await api(
          "/api/attendance/checkin",
          {
            method:"POST",

            body:
              JSON.stringify(body)

          }
        );


      playAttendanceSound(
        "checkin"
      );


      showSuccess(
        result.message ||
        "Check in successfully."
      );


      /*
       * Worker is now checked in.
       */

      checkoutBtn.disabled =
        false;

      checkinBtn.disabled =
        true;


    }catch(error){

      playAttendanceSound(
        "error"
      );

      showError(
        error.message ||
        "Check-in failed."
      );


      checkinBtn.disabled =
        false;

    }

  }
);


/* =========================================================
   CHECK OUT
   ========================================================= */

checkoutBtn.addEventListener(
  "click",
  async function(){

    if(!currentWorker){

      playAttendanceSound(

/* =========================================================
   QR SCANNER
   ========================================================= */

async function startScanner(){

  try{

    if(
      typeof Html5Qrcode ===
      "undefined"
    ){

      scannerStatus.textContent =
        "QR Scanner library unavailable. Use Worker Code.";

      return;

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        },

        aspectRatio:1.0

      },

      decodedText=>{

        /*
         * Put QR value into Worker Code.
         */

        workerCode.value =
          decodedText;


        /*
         * Find worker automatically.
         */

        findWorker(
          decodedText
        );


        scannerStatus.textContent =
          "QR detected. Worker loaded.";

      },

      errorMessage=>{

        /*
         * Scanner continuously searches.
         * No error message needed.
         */

      }

    );


    scannerStatus.textContent =
      "Camera active — scan worker QR or use Worker Code.";

  }catch(error){

    console.log(
      "QR camera unavailable:",
      error
    );

    scannerStatus.textContent =
      "QR camera unavailable. Use Worker Code above.";

  }

}


/* =========================================================
   INITIALIZE
   ========================================================= */

async function initialize(){

  try{

    await loadCompanies();

  }catch(error){

    console.error(
      "Initialization company error:",
      error
    );

  }


  getGPS();


  /*
   * Start QR scanner.
   */

  startScanner();

}


/* =========================================================
   START APP
   ========================================================= */

initialize();
