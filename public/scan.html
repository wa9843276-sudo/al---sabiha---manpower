<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Attendance | AL SABIHA</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>
shell("scan","Scan QR Attendance",`<div class="panel" style="max-width:720px;margin:auto"><h2>Worker QR Check-in / Check-out</h2><p style="color:#718096">Enter the worker code printed in the QR. The page can also use your device camera after the QR reader is enabled in the browser.</p><div class="field"><label>Worker Code</label><input id="code" placeholder="e.g. W001"></div><br><button class="btn gold" onclick="lookup()">Find Worker</button><div id="result" style="margin-top:20px"></div></div>`);
async function lookup(){try{const d=await api("/api/attendance/lookup",{method:"POST",body:JSON.stringify({worker_code:$("#code").value})});window.worker=d.worker;let opts=d.sites.map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.company_name||"")}</option>`).join("");$("#result").innerHTML=`<div class="card"><h2>${esc(d.worker.name)} <small>(${esc(d.worker.worker_code)})</small></h2><div class="field"><label>Site</label><select id="site">${opts}</select></div><br><button class="btn gold" onclick="checkIn()">Check In</button> <button class="btn dark" onclick="checkOut()">Check Out</button><p id="msg"></p></div>`}catch(e){alert(e.message)}}async function geo(){return new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>r({latitude:p.coords.latitude,longitude:p.coords.longitude}),()=>r({}),{enableHighAccuracy:true,timeout:5000}):r({}))}async function checkIn(){const g=await geo();try{const d=await api("/api/attendance/checkin",{method:"POST",body:JSON.stringify({worker_code:worker.worker_code,site_id:$("#site").value,...g})});$("#msg").textContent="✓ Check-in successful at "+d.time}catch(e){alert(e.message)}}async function checkOut(){try{const d=await api("/api/attendance/checkout",{method:"POST",body:JSON.stringify({worker_code:worker.worker_code})});$("#msg").textContent="✓ Check-out successful at "+d.time}catch(e){alert(e.message)}}loadMe();</script></body></html>
