<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | AL SABIHA</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>
shell("settings","Settings",`<div class="panel" style="max-width:650px"><h2>Change Password</h2><form id="f"><div class="field"><label>Current Password</label><input id="old" type="password" required></div><br><div class="field"><label>New Password</label><input id="np" type="password" required></div><br><button class="btn gold">Change Password</button></form></div><div class="panel"><h2>System</h2><p style="color:#718096">AL SABIHA GROUP OF COMPANIES • Online Manpower Management System</p><a class="btn dark" href="/api/backup/download">Download Database Backup</a></div>`);
$("#f").onsubmit=async e=>{e.preventDefault();try{await api("/api/settings/password",{method:"POST",body:JSON.stringify({current_password:$("#old").value,new_password:$("#np").value})});alert("Password changed successfully.");e.target.reset()}catch(x){alert(x.message)}};loadMe();</script></body></html>
