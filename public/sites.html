<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sites | AL SABIHA</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>
shell("sites","Sites & Locations",`<div class="panel"><h2>Add / Edit Site</h2><form id="f"><input type="hidden" id="id"><div class="form-grid"><div class="field"><label>Site Name</label><input id="name" required></div><div class="field"><label>Location</label><input id="location"></div><div class="field"><label>Company</label><select id="company"></select></div><div class="field"><label>Contact Person</label><input id="contact_person"></div><div class="field"><label>Contact Number</label><input id="contact_number"></div><div class="field"><label>Status</label><select id="status"><option>Active</option><option>Inactive</option></select></div></div><br><button class="btn gold">Save Site</button></form></div><div class="panel"><h2>Sites & Locations</h2><div class="table-wrap"><table><thead><tr><th>Site</th><th>Location</th><th>Company</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>`);
let data=[],companies=[];async function load(){companies=await api("/api/companies");$("#company").innerHTML='<option value="">— Select Company —</option>'+companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");data=await api("/api/sites");$("#rows").innerHTML=data.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.location||"—")}</td><td>${esc(s.company_name||"—")}</td><td><span class="badge">${esc(s.status)}</span></td><td><button class="btn ghost" onclick="edit(${s.id})">Edit</button> <button class="btn ghost" onclick="del(${s.id})">Disable</button></td></tr>`).join("")||'<tr><td colspan="5">No sites.</td></tr>'}window.edit=id=>{const s=data.find(x=>x.id===id);$("#id").value=id;$("#name").value=s.name;$("#location").value=s.location||"";$("#company").value=s.company_id||"";$("#contact_person").value=s.contact_person||"";$("#contact_number").value=s.contact_number||"";$("#status").value=s.status||"Active"};window.del=async id=>{if(confirm("Disable this site?")){await api("/api/sites/"+id,{method:"DELETE"});load()}};$("#f").onsubmit=async e=>{e.preventDefault();const b={name:$("#name").value,location:$("#location").value,company_id:$("#company").value,contact_person:$("#contact_person").value,contact_number:$("#contact_number").value,status:$("#status").value};const id=$("#id").value;await api(id?"/api/sites/"+id:"/api/sites",{method:id?"PUT":"POST",body:JSON.stringify(b)});e.target.reset();$("#id").value="";load()};load();loadMe();</script></body></html>
