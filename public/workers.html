<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workers</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<script src="/app.js"></script>

<script>

shell("workers","Workers",`

<div class="panel">

  <div class="toolbar">
    <h2>Add / Edit Worker</h2>
  </div>

  <form id="f">

    <input type="hidden" id="id">

    <div class="form-grid">

      <div class="field">
        <label>Worker Code</label>
        <input id="code" required>
      </div>

      <div class="field">
        <label>Worker Name</label>
        <input id="name" required>
      </div>

      <div class="field">
        <label>Designation</label>
        <input id="designation">
      </div>

      <div class="field">
        <label>Employee Type</label>

        <select id="type">
          <option value="Company">Company</option>
          <option value="Supplier">Supplier</option>
        </select>

      </div>

      <div class="field">
        <label>Assigned Company</label>

        <select id="company_id">
          <option value="">Select Company</option>
        </select>

      </div>

      <div class="field">
        <label>Vendor / Supplier</label>
        <input id="vendor">
      </div>

      <div class="field">
        <label>Mobile</label>
        <input id="mobile">
      </div>

      <div class="field">
        <label>Salary</label>
        <input id="salary" type="number">
      </div>

      <div class="field">
        <label>Joining Date</label>
        <input id="joining" type="date">
      </div>

      <div class="field">
        <label>Status</label>

        <select id="status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>

      </div>

    </div>

    <br>

    <button
      type="submit"
      class="btn gold">
      Save Worker
    </button>

    <button
      type="button"
      class="btn ghost"
      onclick="clearForm()">
      Clear
    </button>

  </form>

</div>


<div class="panel">

  <div class="toolbar">

    <h2>Worker Database</h2>

    <input
      id="search"
      class="search"
      placeholder="Search workers..."
    >

  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>Code</th>
          <th>Name</th>
          <th>Type</th>
          <th>Assigned Company</th>
          <th>Vendor</th>
          <th>Designation</th>
          <th>Mobile</th>
          <th>Status</th>
          <th>Actions</th>

        </tr>

      </thead>

      <tbody id="rows"></tbody>

    </table>

  </div>

</div>

`);


let data = [];


/* =========================================================
   LOAD COMPANIES
   ========================================================= */

async function loadCompanies(){

  try{

    const companiesData =
      await api("/api/companies");

    const companies =
      Array.isArray(companiesData)
        ? companiesData
        : [];

    const select =
      $("#company_id");

    select.innerHTML =
      `<option value="">Select Company</option>`;

    companies
      .filter(c => c.status === "Active")
      .forEach(c => {

        const option =
          document.createElement("option");

        option.value = c.id;

        option.textContent =
          c.name;

        select.appendChild(option);

      });

  }catch(error){

    console.error(
      "Company loading error:",
      error
    );

  }

}


/* =========================================================
   LOAD WORKERS
   ========================================================= */

async function load(){

  try{

    data =
      await api(
        "/api/workers?search=" +
        encodeURIComponent(
          $("#search").value
        )
      );

    const rows =
      $("#rows");


    rows.innerHTML =

      data.map(w => `

        <tr>

          <td>
            ${esc(w.worker_code)}
          </td>

          <td>
            <b>
              ${esc(w.name)}
            </b>
          </td>

          <td>
            ${esc(
              w.employee_type || "—"
            )}
          </td>

          <td>
            ${esc(
              w.company_name || "—"
            )}
          </td>

          <td>
            ${esc(
              w.vendor || "—"
            )}
          </td>

          <td>
            ${esc(
              w.designation || "—"
            )}
          </td>

          <td>
            ${esc(
              w.mobile || "—"
            )}
          </td>

          <td>

            <span class="badge">
              ${esc(
                w.status || "—"
              )}
            </span>

          </td>

          <td>

            <button
              class="btn ghost"
              onclick="edit(${w.id})">
              Edit
            </button>

            <button
              class="btn ghost"
              onclick="qr(${w.id})">
              QR
            </button>

            <button
              class="btn ghost"
              onclick="archiveWorker(${w.id})">
              📦 Archive
            </button>

          </td>

        </tr>

      `).join("")

      ||

      `<tr>
        <td colspan="9">
          No workers found.
        </td>
      </tr>`;

  }catch(error){

    console.error(
      "Worker loading error:",
      error
    );

    $("#rows").innerHTML =
      `<tr>
        <td colspan="9">
          Unable to load workers.
        </td>
      </tr>`;

  }

}


/* =========================================================
   EDIT WORKER
   ========================================================= */

window.edit = id => {

  const w =
    data.find(
      x => Number(x.id) === Number(id)
    );

  if(!w){

    showError(
      "Worker not found."
    );

    return;

  }


  $("#id").value =
    w.id;

  $("#code").value =
    w.worker_code || "";

  $("#name").value =
    w.name || "";

  $("#designation").value =
    w.designation || "";

  $("#type").value =
    w.employee_type || "Company";

  $("#company_id").value =
    w.company_id || "";

  $("#vendor").value =
    w.vendor || "";

  $("#mobile").value =
    w.mobile || "";

  $("#salary").value =
    w.salary || "";

  $("#joining").value =
    w.joining_date || "";

  $("#status").value =
    w.status || "Active";


  window.scrollTo(
    0,
    0
  );

};


/* =========================================================
   CLEAR FORM
   ========================================================= */

window.clearForm = function(){

  $("#f").reset();

  $("#id").value = "";

  $("#company_id").value = "";

};


/* =========================================================
   ARCHIVE WORKER
   Record + Attendance محفوظ رہے گی
   ========================================================= */

window.archiveWorker = async id => {

  const worker =
    data.find(
      x => Number(x.id) === Number(id)
    );

  const workerName =
    worker
      ? worker.name
      : "this worker";


  const confirmed =
    confirm(

      "ARCHIVE WORKER\n\n" +

      "Worker: " +
      workerName +

      "\n\n" +

      "This worker will be moved to Inactive status.\n\n" +

      "The following will NOT be deleted:\n" +

      "• Worker profile\n" +
      "• Attendance history\n" +
      "• Check-in / Check-out records\n" +
      "• Reports history\n\n" +

      "You can keep this worker's historical record safely.\n\n" +

      "Do you want to archive this worker?"

    );


  if(!confirmed){

    return;

  }


  try{

    await api(
      "/api/workers/" + id,
      {
        method: "DELETE"
      }
    );


    await load();


    alert(
      "Worker archived successfully.\n\n" +
      "Worker record and attendance history are محفوظ."
    );


  }catch(error){

    showError(

      error.message ||

      "Unable to archive worker."

    );

  }

};


/* =========================================================
   WORKER QR
   ========================================================= */

window.qr = async id => {

  try{

    const d =
      await api(
        "/api/workers/" +
        id +
        "/qrcode"
      );

    const w =
      d.worker;


    const x =
      window.open(
        "",
        "QR",
        "width=520,height=650"
      );


    x.document.write(`

      <html>

      <head>

        <title>
          AL SABIHA Worker QR
        </title>

      </head>

      <body
        style="
          font-family:Arial;
          text-align:center;
          padding:30px;
        "
      >

        <h2>
          AL SABIHA
        </h2>

        <h3>
          ${esc(w.name)}
        </h3>

        <p>
          ${esc(w.worker_code)}
        </p>

        <img
          src="${d.qr}"
          style="
            width:350px;
            max-width:90%;
          "
        >

        <p>
          Manpower Attendance
        </p>

      </body>

      </html>

    `);

    x.document.close();

  }catch(error){

    showError(
      error.message ||
      "Unable to generate QR."
    );

  }

};


/* =========================================================
   SAVE WORKER
   ========================================================= */

$("#f").onsubmit =
  async function(e){

    e.preventDefault();


    const id =
      $("#id").value;


    const b = {

      worker_code:
        $("#code").value.trim(),

      name:
        $("#name").value.trim(),

      designation:
        $("#designation").value.trim(),

      employee_type:
        $("#type").value,

      company_id:
        $("#company_id").value
          ? Number(
              $("#company_id").value
            )
          : null,

      vendor:
        $("#vendor").value.trim(),

      mobile:
        $("#mobile").value.trim(),

      salary:
        $("#salary").value,

      joining_date:
        $("#joining").value,

      status:
        $("#status").value

    };


    try{

      await api(

        id
          ? "/api/workers/" + id
          : "/api/workers",

        {

          method:
            id
              ? "PUT"
              : "POST",

          body:
            JSON.stringify(b)

        }

      );


      clearForm();

      await load();


      showSuccess(

        id
          ? "Worker updated successfully."
          : "Worker added successfully."

      );


    }catch(error){

      showError(

        error.message ||

        "Unable to save worker."

      );

    }

  };


/* =========================================================
   SEARCH
   ========================================================= */

$("#search").oninput =
  load;


/* =========================================================
   INITIALIZE
   ========================================================= */

async function initialize(){

  await loadCompanies();

  await load();

  loadMe();

}


initialize();

</script>

</body>
</html>
