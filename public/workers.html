<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Worker Database | AL SABIHA</title>
<link rel="icon" href="/Logo.svg"></head><body>
<script src="/app.js"></script>
<script>
shell("workers", "Worker Database", `
<div class="panel">
  <div class="toolbar">
    <div class="field grow"><label for="sName">Search by Employee Name</label>
      <div class="input-clear"><input id="sName" type="search" autocomplete="off" placeholder="e.g. Waqas Ali"><button type="button" id="cName" aria-label="Clear name search" hidden>×</button></div></div>
    <div class="field grow"><label for="sCode">Search by Employee ID</label>
      <div class="input-clear"><input id="sCode" type="search" autocomplete="off" placeholder="e.g. AAT001"><button type="button" id="cCode" aria-label="Clear employee ID search" hidden>×</button></div></div>
  </div>
  <div class="toolbar" style="margin-bottom:0">
    <div class="field"><label for="fStatus">Status</label><select id="fStatus"><option value="">All</option><option>Active</option><option>Inactive</option></select></div>
    <div class="field"><label for="fType">Company Type</label><select id="fType"><option value="">All</option><option value="Company">Group Company</option><option value="Supplier">Supplier (SUP)</option></select></div>
    <div class="field"><label for="fCompany">Working company</label><select id="fCompany"><option value="">All</option><option value="none">Unassigned</option></select></div>
    <div class="field" style="flex:0 0 110px;min-width:110px"><label for="fSize">Per page</label><select id="fSize"><option>25</option><option>50</option><option>100</option></select></div>
    <button class="btn ghost" id="reset">Reset</button>
    <a class="btn ghost" id="export" href="#">Export Excel</a>
    <a class="btn gold" href="/worker-add.html">Add Worker</a>
  </div>
</div>
<div class="panel" style="padding:0">
  <div id="summary" class="pager" style="margin:0;padding:12px 16px" aria-live="polite"></div>
  <div class="table-wrap" style="border:0;border-radius:0">
    <table><thead><tr>
      <th class="sortable" data-sort="code" tabindex="0">Employee ID</th>
      <th class="sortable" data-sort="name" tabindex="0">Employee Name</th>
      <th class="sortable" data-sort="designation" tabindex="0">Designation</th>
      <th class="sortable" data-sort="type" tabindex="0">Company Type</th>
      <th class="sortable" data-sort="sponsor" tabindex="0">Visa/Sponsor Company</th>
      <th class="sortable" data-sort="company" tabindex="0">Working/Assigned Company</th>
      <th class="sortable" data-sort="status" tabindex="0">Status</th><th>Actions</th></tr></thead>
    <tbody id="rows"><tr><td colspan="8"><div class="loading">Loading workers…</div></td></tr></tbody></table>
  </div>
  <div class="pager" style="padding:0 16px 14px"><span id="pageInfo"></span><span class="actions"><button class="btn ghost sm" id="prev">Previous</button><button class="btn ghost sm" id="next">Next</button></span></div>
</div>
`);
loadMe();
const S = { name: "", code: "", status: "", company_type: "", company_id: "", sort: "name", dir: "asc", page: 1, page_size: 25 };
const el = { name: $("#sName"), code: $("#sCode"), status: $("#fStatus"), type: $("#fType"), company: $("#fCompany"), size: $("#fSize") };
let seq = 0, pages = 1;

/* restore state: URL first, then the last session state */
(function restore() {
  const u = new URLSearchParams(location.search);
  const saved = u.toString() ? Object.fromEntries(u) : JSON.parse(sessionStorage.getItem("wdb") || "{}");
  Object.keys(S).forEach(k => { if (saved[k] !== undefined) S[k] = ["page", "page_size"].includes(k) ? Number(saved[k]) || S[k] : saved[k]; });
  el.name.value = S.name; el.code.value = S.code; el.status.value = S.status; el.type.value = S.company_type; el.size.value = String(S.page_size);
})();

function sync() {
  const q = qs(S);
  history.replaceState(null, "", "?" + q);
  sessionStorage.setItem("wdb", JSON.stringify(S));
  $("#cName").hidden = !S.name; $("#cCode").hidden = !S.code;
  $("#export").href = "/api/v2/export/workers.xlsx?" + qs({ name: S.name, code: S.code, status: S.status, company_type: S.company_type, company_id: S.company_id, sort: S.sort, dir: S.dir });
  $$("th.sortable").forEach(th => th.removeAttribute("aria-sort") || (th.dataset.sort === S.sort && th.setAttribute("aria-sort", S.dir === "asc" ? "ascending" : "descending")));
}

async function load() {
  const my = ++seq; sync();
  try {
    const d = await api("/api/v2/workers?" + qs(S));
    if (my !== seq) return;                       // ignore stale responses
    pages = d.pages;
    const active = S.name || S.code;
    $("#summary").innerHTML = `<span><b>${d.total}</b> worker${d.total === 1 ? "" : "s"} ${active || S.status || S.company_type || S.company_id ? "match your filters" : "in the database"}</span>`;
    $("#rows").innerHTML = d.items.length ? d.items.map(w => `<tr class="${active ? "match" : ""}">
      <td><b>${hl(w.worker_code, S.code)}</b></td><td>${hl(w.name, S.name)}</td><td>${esc(w.designation || "—")}</td>
      <td><span class="badge ${w.employee_type === "Supplier" ? "gold" : "info"}">${esc(w.company_type_label)}</span></td>
      <td>${esc(w.sponsor_name || "—")}</td><td>${esc(w.company_name || "Unassigned")}</td>
      <td><span class="badge ${w.status === "Active" ? "ok" : "bad"}">${esc(w.status)}</span></td>
      <td class="actions"><a class="btn ghost sm" href="/worker.html?id=${w.id}">View</a><a class="btn ghost sm" href="/worker.html?id=${w.id}&edit=1">Edit</a></td></tr>`).join("")
      : `<tr><td colspan="8"><div class="empty"><b>No workers found</b>Try a different name or ID, or clear the filters.</div></td></tr>`;
    $("#pageInfo").textContent = `Page ${d.page} of ${d.pages}`;
    $("#prev").disabled = d.page <= 1; $("#next").disabled = d.page >= d.pages;
  } catch (e) { $("#rows").innerHTML = `<tr><td colspan="8"><div class="message error">${esc(e.message)}</div></td></tr>`; }
}
const reload = () => { S.page = 1; load(); };
const typed = debounce(reload, 200);
el.name.addEventListener("input", () => { S.name = el.name.value; typed(); });
el.code.addEventListener("input", () => { S.code = el.code.value; typed(); });
$("#cName").onclick = () => { el.name.value = ""; S.name = ""; reload(); el.name.focus(); };
$("#cCode").onclick = () => { el.code.value = ""; S.code = ""; reload(); el.code.focus(); };
el.status.onchange = () => { S.status = el.status.value; reload(); };
el.type.onchange = () => { S.company_type = el.type.value; reload(); };
el.company.onchange = () => { S.company_id = el.company.value; reload(); };
el.size.onchange = () => { S.page_size = Number(el.size.value); reload(); };
$("#prev").onclick = () => { if (S.page > 1) { S.page--; load(); } };
$("#next").onclick = () => { if (S.page < pages) { S.page++; load(); } };
$("#reset").onclick = () => { Object.assign(S, { name: "", code: "", status: "", company_type: "", company_id: "", sort: "name", dir: "asc", page: 1 }); Object.values(el).forEach(e => e.id !== "fSize" && (e.value = "")); load(); };
$$("th.sortable").forEach(th => {
  const go = () => { const k = th.dataset.sort; S.dir = S.sort === k && S.dir === "asc" ? "desc" : "asc"; S.sort = k; S.page = 1; load(); };
  th.onclick = go; th.onkeydown = e => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), go());
});
api("/api/v2/lookups").then(L => { L.companies.forEach(c => el.company.add(new Option(c.name, c.id))); el.company.value = S.company_id; });
load();
</script></body></html>
